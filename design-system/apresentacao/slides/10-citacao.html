<!-- 10-citacao — depoimento de cliente ou de pessoa do time. Uma citação por slide.
     As aspas são grafismo em roxo — é o único caso de roxo em tamanho grande,
     e ele não carrega texto: é ornamento. -->
<style>
.quote{justify-content:center;align-items:center;text-align:center;gap:40px}
.quote__aspas{font-size:200px;line-height:140px;font-weight:700;color:var(--accent-2);opacity:.35}
.quote__txt{font-size:48px;line-height:64px;font-weight:400;color:var(--ink);max-width:1400px}
.quote__autor{display:flex;align-items:center;gap:24px;margin-top:16px}
.quote__autor img{width:100px;height:100px;border-radius:50%;object-fit:cover}
</style>
<section class="slide slide--white">
  <div class="slide__pad quote">
    <span class="quote__aspas">&ldquo;</span>
    <p class="quote__txt">{{CITACAO}}</p>
    <div class="regua"></div>
    <div class="quote__autor">
      <img src="assets/retrato.jpg" alt="{{NOME}}">
      <div style="text-align:left">
        <strong class="t-card-sm">{{NOME}}</strong>
        <p class="t-legenda">{{CARGO}} · {{EMPRESA}}</p>
      </div>
    </div>
  </div>
</section>
